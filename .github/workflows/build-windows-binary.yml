name: Build Windows Binary

on:
  push:
    branches:
      - copilot/replace-existing-binary
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild InjectSetConsole.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: InjectSetConsole-exe
          path: x64/Release/InjectSetConsole.exe
          if-no-files-found: error

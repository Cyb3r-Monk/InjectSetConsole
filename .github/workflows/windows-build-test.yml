name: Windows build and smoke test

on:
  push:
    branches:
      - copilot/add-compiled-binary-to-repo
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build InjectSetConsole (Release x64)
        run: msbuild InjectSetConsole.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Smoke test netsh interaction
        shell: powershell
        run: |
          $exe = Join-Path $PWD "x64\Release\InjectSetConsole.exe"
          if (-not (Test-Path $exe)) {
            throw "Compiled binary not found at $exe"
          }

          $target = "C:\Windows\System32\netsh.exe"
          $startInfo = New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName = $exe
          $startInfo.Arguments = $target
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true

          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $startInfo
          $null = $proc.Start()

          $doneSeen = $false
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            while (-not $proc.StandardOutput.EndOfStream) {
              $line = $proc.StandardOutput.ReadLine()
              if ($line) { Write-Host $line }
              if ($line -like "*Done. Main thread now executing*") {
                $doneSeen = $true
                break
              }
            }

            if ($doneSeen) { break }
            if ($proc.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }

          if (-not $doneSeen) {
            throw "Smoke test did not reach thread execution marker"
          }

          $proc.StandardInput.WriteLine("g")
          $proc.StandardInput.Flush()

          $notepad = $null
          $notepadDeadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $notepadDeadline) {
            $notepad = Get-Process -Name notepad -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($notepad) { break }
            Start-Sleep -Milliseconds 500
          }

          if (-not $notepad) {
            throw "Smoke test failed: notepad.exe was not launched"
          }

          Stop-Process -Name notepad -Force -ErrorAction SilentlyContinue
          Stop-Process -Name netsh -Force -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            $proc.Kill()
          }

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: InjectSetConsole-x64-Release
          path: x64/Release/InjectSetConsole.exe
